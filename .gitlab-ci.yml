image: rust:latest

stages:
  - formatting
  - testing
  - release

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

cache:
  key:
    files:
      - Cargo.lock
  paths:
    - .cargo/registry/
    - .cargo/git/
    - target/

format:
  stage: formatting
  script:
    - cargo fmt --check

test:
  stage: testing
  needs:
    - format
  before_script:
    - apt-get update -yqq
    - apt-get install -yqq --no-install-recommends libclang-dev build-essential libtesseract-dev tesseract-ocr-eng xorg-dev libwayland-dev libwayland-egl1 libegl1-mesa-dev cmake libpipewire-0.3-dev libgbm-dev jq
    - ./update.sh
  script:
    - cargo test --workspace

release-build:
  stage: release
  needs:
    - test
  before_script:
    - apt-get update -yqq
    - apt-get install -yqq --no-install-recommends libclang-dev build-essential libtesseract-dev tesseract-ocr-eng xorg-dev libwayland-dev libwayland-egl1 libegl1-mesa-dev cmake libpipewire-0.3-dev libgbm-dev jq
  script:
    - cargo build --release
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  artifacts:
    name: "wfinfo-ng-$CI_COMMIT_REF_SLUG"
    paths:
      - target/release/wfinfo
      - target/release/settings
      - target/release/ability-timer
      - target/release/image
      - target/release/relics
      - target/release/theme_tune
    expire_in: 1 week
