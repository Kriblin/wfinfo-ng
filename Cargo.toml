[package]
name = "wfinfo-ng"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "wfinfo"
path = "src/lib.rs"

[[bin]]
name = "wfinfo"
path = "src/bin/main.rs"

[[bin]]
name = "settings"
path = "src/bin/settings.rs"

[dependencies]
anyhow = "1.0.100"
approx = "0.5.1"
clap = { version = "4.5.51", features = ["derive"] }
eframe = "0.33.3"
global-hotkey = "0.7.0"
image = "0.25.9"
indexmap = { version = "2.13.0", features = ["serde"] }
lazy_static = "1.4.0"
levenshtein = "1.0.5"
notify = "8.2.0"
ordered-float = { version = "5.0.0", features = ["serde"] }
palette = "0.7.6"
rayon = "1.11"
rdev = "0.5.3"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde-aux = "4.7.0"
serde_json = "1.0.149"
serde_yaml = "0.9.32"
kreuzberg-tesseract = "4.2.14"
thiserror = "2.0.18"
xcap = "0.8.1"
log = "0.4.29"
env_logger = "0.11.8"
reqwest = { version = "0.13.1", features = ["blocking"] }
dirs = "6.0.0"