[package]
name = "wfinfo-ng"
version = "0.1.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "wfinfo"
path = "src/lib.rs"

[[bin]]
name = "wfinfo"
path = "src/bin/main.rs"

[[bin]]
name = "settings"
path = "src/bin/settings.rs"

[[bin]]
name = "ability-timer"
path = "src/bin/ability-timer.rs"

[[bin]]
name = "image"
path = "src/bin/image.rs"

[[bin]]
name = "relics"
path = "src/bin/relics.rs"

[[bin]]
name = "theme_tune"
path = "src/bin/theme_tune.rs"

[dependencies]
anyhow = "1.0"
approx = "0.5.1"
clap = { version = "4.6.1", features = ["derive"] }
eframe = "0.35.0"
global-hotkey = "0.8.0"
image = "0.25.10"
indexmap = { version = "2.14.0", features = ["serde"] }
lazy_static = "1.5"
levenshtein = "1.0.5"
notify = "8.2"
ordered-float = { version = "5.3", features = ["serde"] }
palette = "0.7.6"
rayon = "1.12"
rdev = "0.5.3"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde-aux = "4.7.0"
serde_json = "1.0"
toml = "0.9.8"
kreuzberg-tesseract = "4.9"
thiserror = "2.0"
xcap = "0.9"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.13", features = ["blocking"] }
dirs = "6.0"
