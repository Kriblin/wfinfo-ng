[package]
name = "wfinfo-ng"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "wfinfo"
path = "src/lib.rs"

[[bin]]
name = "wfinfo"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0.63"
approx = "0.5.1"
clap = { version = "4.5.1", features = ["derive"] }
eframe = "0.23.0"
egui_extras = "0.23.0"
global-hotkey = "0.7.0"
image = "0.25.6"
indexmap = { version = "2.10.0", features = ["serde"] }
lazy_static = "1.4.0"
levenshtein = "1.0.5"
notify = "8.1.0"
ordered-float = { version = "5.0.0", features = ["serde"] }
palette = "0.7.6"
rayon = "1.5.3"
rdev = "0.5.3"
serde = { version = "1.0.219", features = ["serde_derive"] }
serde-aux = "4.7.0"
serde_json = "1.0.85"
serde_yaml = "0.9.32"
tesseract = "0.15.2"
xcap = "0.4.1"
log = "0.4.22"
env_logger = "0.11.8"
reqwest = { version = "0.12.7", features = ["blocking"] }
dirs = "6.0.0"
